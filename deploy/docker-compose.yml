# Live setup for a VPS with its own static IP. Started by deploy/setup-vps.sh.
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_PATH: /data/trading.db
      PORT: "8000"
    volumes:
      - data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  data:
  caddy_data:
